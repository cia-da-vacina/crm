# Nome de projeto explícito: o diretório se chama "backend" (igual ao
# neohabit/backend), e o Compose usa o basename do diretório como nome de
# projeto por padrão — sem isto, os volumes colidem entre os dois repos.
name: cia-da-vacina-crm

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: crm-api
    image: crm-api:latest
    volumes:
      - .:/app
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - crm-network

  postgres:
    image: postgres:18.4-alpine
    container_name: crm-postgres
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm2026
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U crm -d crm" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crm-network

networks:
  crm-network:
    driver: bridge

volumes:
  postgres_data:
