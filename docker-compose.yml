# CRM Cia da Vacina — local / server stack (Docker)
#
# Demo mode (default): frontend with in-process mocks — no Go API required.
# When Felipe's API is ready, set USE_MOCKS=false and point API_URL at the backend.
#
# Usage:
#   docker compose --env-file .env.docker.example up --build -d
#   # or customize:
#   cp .env.docker.example .env.docker && docker compose --env-file .env.docker up --build -d
#
# App: http://localhost:3000
# Login: admin@ciadavacina.com.br / admin123

name: cia-vacina-crm

services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        USE_MOCKS: ${USE_MOCKS:-true}
        COOKIE_SECURE: ${COOKIE_SECURE:-false}
        API_URL: ${API_URL:-http://backend:8080/api/v1}
    image: cia-vacina-frontend:local
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      USE_MOCKS: ${USE_MOCKS:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Ignored while USE_MOCKS=true
      API_URL: ${API_URL:-http://backend:8080/api/v1}
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:3000/login",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  # Enable later with: docker compose --profile backend up
